[workspace]
resolver = "3"
members = ["ark-algebra", "ark-serde-compat", "circom-types", "groth16", "groth16-material", "groth16-sol"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
homepage = "https://taceo.io/"
repository = "https://github.com/TaceoLabs/circom-helpers"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alloy-primitives = "1"
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.6" }
ark-bls12-381 = "0.6"
ark-bn254 = { version = "0.6" }
ark-ec = { version = "0.6", default-features = false }
ark-ff = { version = "0.6", default-features = false }
ark-groth16 = { version = "0.6", default-features = false }
ark-poly = { version = "0.6", default-features = false }
ark-relations = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false }
ark-snark = "0.6"
ark-std = "0.6"
byteorder = "1.5"
ciborium = "0.2.2"
circom-witness-rs = "0.3"
clap = { version = "4.4.8", features = ["derive"] }
eyre = "0.6"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
postcard = "1"
rand = "0.8"
rayon = "1.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
ruint = "1.19"
serde = { version = "1.0" }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
assertions_on_result_states = "deny"
dbg_macro = "deny"
decimal_literal_representation = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
missing_assert_message = "deny"
pedantic = { level = "deny", priority = -1 }
print_stderr = "deny"
print_stdout = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
missing_docs = "deny"

# This profile can be used for CI in pull requests.
[profile.ci-dev]
inherits = "dev"
opt-level = 1
debug = true
incremental = false

[profile.profiling]
inherits = "bench"
debug = true
lto = "thin"
