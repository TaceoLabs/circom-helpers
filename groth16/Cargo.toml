[package]
name = "taceo-groth16"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
description = "An implementation of the Groth16 zkSNARK proof system."
readme = "./README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["circom", "groth16", "snarkjs", "zero-knowledge", "zk"]
exclude = [".gitignore"]

[[bench]]
harness = false
name = "groth16"

[dependencies]
ark-algebra = { package = "taceo-ark-algebra", path = "../ark-algebra", version = "0.1.0" }
ark-ec.workspace = true
ark-ff.workspace = true
ark-groth16 = { workspace = true, features = ["parallel"] }
ark-relations.workspace = true
eyre.workspace = true
rayon.workspace = true
tracing.workspace = true

[dev-dependencies]
ark-bls12-381.workspace = true
ark-bn254.workspace = true
ark-poly.workspace = true
ark-snark.workspace = true
ark-std.workspace = true
criterion = "0.8"
